[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-auditor"
version = "1.0.0"
description = "Evidence-grounded AI answer auditing with corrective retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3", "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "alembic>=1.14,<2", "arq>=0.26,<1", "redis>=5,<6",
  "python-multipart>=0.0.20,<1", "pypdf>=6.3,<7",
  "httpx>=0.27,<1", "numpy>=2,<3",
]
[project.optional-dependencies]
models = ["sentence-transformers>=3.4,<6", "sentencepiece>=0.2,<1"]
vision = ["colpali-engine>=0.3,<1", "pillow>=10,<13"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]
[tool.setuptools.packages.find]
include = ["backend*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
target-version = "py311"
